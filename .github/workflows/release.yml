name: Release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in pyproject.toml (and memscout.__version__).
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Allow ptrace of child processes
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope || true

      - name: Install gdb (Level 2 DWARF authoring reads DWARF through gdb)
        run: sudo apt-get update && sudo apt-get install -y gdb

      - name: Install and build tooling
        run: |
          python -m pip install --upgrade pip build
          pip install -e .

      - name: Verify tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mod="$(python -c 'import memscout; print(memscout.__version__)')"
          echo "tag=$tag  pyproject=$proj  __version__=$mod"
          if [ "$tag" != "$proj" ] || [ "$tag" != "$mod" ]; then
            echo "::error::tag v$tag must match pyproject ($proj) and memscout.__version__ ($mod)"
            exit 1
          fi

      - name: Run tests
        run: ./run-tests.sh

      - name: Build sdist and wheel
        run: python -m build

      # Use the runner's gh CLI (no third-party action / Node runtime) to publish.
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
