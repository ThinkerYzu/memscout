name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.11", "3.13" ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Tests attach to their own child processes via /proc/<pid>/mem; make sure
      # Yama doesn't get in the way on the runner.
      - name: Allow ptrace of child processes
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope || true

      - name: Install (with the authoring extra for DWARF tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[authoring]"

      - name: Run tests
        run: ./run-tests.sh
