[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memscout"
version = "0.1.0"
description = "Lightweight, read-only runtime data-collection framework for live Linux processes"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = []          # runtime is stdlib-only; shells out to readelf/debuginfod-find

[project.optional-dependencies]
# Developer-side authoring only (Level 2 DWARF -> spec strings). The reporter/runtime
# core needs none of this.
authoring = ["pyelftools>=0.29"]

[project.scripts]
memscout = "memscout.cli:main"

[tool.setuptools]
packages = ["memscout"]
